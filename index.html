:root{--bg:#f7f7f6;--ink:#2b2b2b;--blue:#4a9fdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh;justify-content:center}
.stage{position:relative;width:min(96vw,680px);aspect-ratio:1}
.art{position:absolute;inset:0;width:100%;height:100%;background:var(--art) center/100% 100% no-repeat;z-index:3;pointer-events:none;user-select:none;-webkit-user-drag:none}
.screen{position:absolute;left:27.637%;top:26.270%;width:44.531%;height:34.082%;z-index:1;overflow:hidden;background:#3f8fcc}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1) scale(1.02);filter:saturate(.85) contrast(1.05);display:none}
.screen.live video{display:block}
.tint{position:absolute;inset:0;background:var(--blue);mix-blend-mode:soft-light;opacity:.55;pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);pointer-events:none}
.glass{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 28% 8%,rgba(255,255,255,.22),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,15,50,.4) 100%)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10%;color:#fbd934;font-weight:900;font-size:clamp(16px,4.6vw,32px);line-height:1.12;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 0 6px rgba(251,217,52,.35)}
.screen.live .msg{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.osd{position:absolute;left:6%;bottom:7%;color:#7dff8a;font:700 clamp(10px,2.4vw,14px) ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-shadow:0 0 4px #1aff4a;opacity:0;transition:opacity .3s;pointer-events:none}
.osd.show{opacity:1}
#crt{display:none;position:absolute;inset:0;width:100%;height:100%}
.screen.glon #crt{display:block}
.screen.glon video{position:absolute;inset:0;opacity:0;pointer-events:none}
.screen{container-type:size}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Outfit","Pretendard","Apple SD Gothic Neo",sans-serif;font-size:27cqh;font-weight:700;line-height:1;color:#fff;-webkit-text-stroke:.75cqh #000;paint-order:stroke fill;padding-top:1cqh;opacity:0;pointer-events:none}
.screen.off{background:#1a1f22}
.screen.off>*:not(.glass){visibility:hidden}
.screen.closing{animation:crtoff .32s ease-in forwards}
.screen.opening{animation:crton .42s ease-out}
@keyframes crtoff{0%{transform:scale(1,1);filter:brightness(1)}60%{transform:scale(1,.02);filter:brightness(2.5)}100%{transform:scale(0,.005);filter:brightness(3)}}
@keyframes crton{0%{transform:scale(0,.005);filter:brightness(3)}40%{transform:scale(1,.02);filter:brightness(2.5)}100%{transform:scale(1,1);filter:brightness(1)}}
.hit{position:absolute;z-index:4;cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}
.cap{position:absolute;z-index:4;border-radius:6px;pointer-events:none;background-image:var(--art);background-repeat:no-repeat;transition:transform .06s,filter .06s,box-shadow .06s}
.cap.down{transform:translateY(2px);filter:brightness(.84) contrast(1.05);box-shadow:inset 0 3px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.35)}
#frameimg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.ledcover{position:absolute;z-index:4;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 35%,#8d9686,#4c5647)}
.live-on .ledcover{display:none}
.shoot{margin-top:26px;font:inherit;font-weight:900;font-size:18px;padding:14px 30px;border-radius:999px;border:3px solid var(--ink);background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.shoot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.note{margin-top:14px;font-size:13px;opacity:.75;text-align:center;max-width:420px;line-height:1.5}
.gallery{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px;width:min(94vw,720px)}
.gallery figure{margin:0;background:#fff;padding:8px 8px 6px;border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.12);transform:rotate(var(--r))}
.gallery img{width:150px;display:block;border-radius:2px}
.gallery figcaption{font-size:11px;text-align:center;margin-top:4px}
.mainp{display:none;position:absolute;inset:0;background:var(--main) center/100% 100% no-repeat}
.screen.home .mainp{display:block}
.stimg{display:none;position:absolute;inset:0;background:center/100% 100% no-repeat}
.screen.wait .stimg{display:block;background-image:var(--waitimg)}
.screen.deny .stimg{display:block;background-image:var(--denyimg)}
.screen.wait .tint,.screen.wait .scan,.screen.wait .glass,.screen.deny .tint,.screen.deny .scan,.screen.deny .glass{display:none}
.msg{display:none!important}
.screen.home .tint,.screen.home .scan,.screen.home .glass,.screen.home .msg,.screen.home #homebtn{display:none}
.start{position:absolute;border:0;padding:0;margin:0;background:var(--startimg) center/100% 100% no-repeat;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:floaty 2.2s ease-in-out infinite;filter:drop-shadow(0 7px 4px rgba(10,60,160,.35))}
.start:active{animation:none;transform:translateY(3%) scale(.95);filter:drop-shadow(0 2px 2px rgba(10,60,160,.35)) brightness(.92)}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11%) scale(1.025)}}
.homebtn{position:absolute;z-index:6;border:0;padding:0;margin:0;background:var(--homeimg) center/100% 100% no-repeat;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .06s,filter .06s}
.folderbtn{background-image:var(--folderimg)}
.screen.home #folderbtn{display:none}
.homebtn.down{transform:translateY(2px) scale(.94);filter:brightness(.85)}
</style>
</head>
<body>
<div class="stage live-on" id="monitor">
  <div class="screen home" id="screen">

        screen.classList.add('live');if(glok)screen.classList.add('glon');mon.classList.add('live-on');
        btn.textContent='📸 찰칵!';
        note.textContent='사진은 아래에 쌓입니다. 이미지를 길게 누르거나 우클릭해서 저장하세요. 손바닥을 5초간 펼치면 촬영돼요.';loadHands();
      })
      .catch(function(e){
        var n=(e&&e.name)||'Error';
        screen.classList.remove('wait');screen.classList.add('deny');
        var why={NotAllowedError:'권한이 거부되었거나, 이 페이지가 열린 환경(미리보기·앱 내 브라우저)에서 카메라가 막혀 있어요.',SecurityError:'이 페이지가 열린 환경에서 카메라가 막혀 있어요.',NotFoundError:'연결된 카메라를 찾지 못했어요.',NotReadableError:'다른 앱이 카메라를 쓰고 있어요. 그 앱을 닫고 다시 시도해 주세요.'};
        note.textContent=(why[n]||'카메라를 열지 못했어요.')+' (오류: '+n+')';

      });
  }
  function snap(){
    if(!stream&&!upImg){if(!powered)powerOn();else goStart();return;}
    var w=v.videoWidth||1280,h=v.videoHeight||960;
    var c=document.createElement('canvas');c.width=w;c.height=h;
    var x=c.getContext('2d');
    if(glok){w=cv.width;h=cv.height;c.width=w;c.height=h;try{x.filter=F().f;}catch(e){}x.drawImage(cv,0,0,w,h);}else if(upImg){w=upImg.width;h=upImg.height;c.width=w;c.height=h;try{x.filter=F().f;}catch(e){}x.drawImage(upImg,0,0,w,h);}else{x.translate(w,0);x.scale(-1,1);try{x.filter=F().f;}catch(e){}x.drawImage(v,0,0,w,h);}
    x.setTransform(1,0,0,1,0,0);x.filter='none';
    if(F().a){x.globalCompositeOperation=F().m;x.globalAlpha=F().a;x.fillStyle=F().c;x.fillRect(0,0,w,h);}
    if(F().fr&&!(glok&&fready)){x.globalCompositeOperation='source-over';x.globalAlpha=1;x.drawImage(frameEl,0,0,w,h);}
    x.globalCompositeOperation='source-over';x.globalAlpha=.09;x.fillStyle='#000';

    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');

    var f=document.createElement('figure');

    var im=new Image();im.src=c.toDataURL('image/jpeg',.92);im.alt='촬영한 사진 '+count;
    var cap=document.createElement('figcaption');cap.textContent='#'+count;
    f.appendChild(im);f.appendChild(cap);gal.insertBefore(f,gal.firstChild);
  }
  function fallback(){
    return;
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','user');inp.style.display='none';
    var b=document.createElement('button');b.id='fb';b.className='shoot';b.style.marginTop='14px';b.textContent='📁 폰 카메라로 찍기 / 사진 불러오기';
    b.onclick=function(){inp.click();};
    inp.onchange=function(){
      var fl=inp.files&&inp.files[0];if(!fl)return;
      var im=new Image();
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');try{x.filter=F().f;}catch(e){}x.drawImage(im,0,0,w,h);x.filter='none';
        if(F().a){x.globalCompositeOperation=F().m;x.globalAlpha=F().a;x.fillStyle=F().c;x.fillRect(0,0,w,h);}
        if(F().fr){x.globalCompositeOperation='source-over';x.globalAlpha=1;x.drawImage(frameEl,0,0,w,h);}
        x.globalCompositeOperation='source-over';x.globalAlpha=.09;x.fillStyle='#000';
        for(var y=0;y<h;y+=3){x.fillRect(0,y,w,1);}
        var url=c.toDataURL('image/jpeg',.92);
        var old=screen.querySelector('.pic');if(old)old.remove();
        var s=new Image();s.src=url;s.className='pic';s.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
        screen.insertBefore(s,screen.firstChild);screen.classList.add('live');screen.classList.remove('glon');v.style.display='none';mon.classList.add('live-on');
        count++;var f=document.createElement('figure');f.style.setProperty('--r',((Math.random()*6-3).toFixed(1))+'deg');
        var g=new Image();g.src=url;g.alt='사진 '+count;var cap=document.createElement('figcaption');cap.textContent='#'+count;
        f.appendChild(g);f.appendChild(cap);gal.insertBefore(f,gal.firstChild);
        URL.revokeObjectURL(im.src);inp.value='';
      };
      im.src=URL.createObjectURL(fl);
    };
    note.parentNode.insertBefore(b,note);document.body.appendChild(inp);
  }
  btn.addEventListener('click',snap);
  var cv=document.getElementById('crt'),gl=null,glok=false,tex=null,uVa=null,uMi=null,uFe=null,fready=false;
  var FS='precision mediump float;varying vec2 u;uniform sampler2D t;uniform sampler2D f;uniform float va;uniform float fe;uniform float mi;void main(){vec2 p=u*2.-1.;float r=dot(p,p);vec2 q=p*.91*(1.+.14*r);float m=smoothstep(1.,.975,max(abs(q.x),abs(q.y)));vec2 s=q*.5+.5;vec2 fu=s;float ca=1.3333;if(va>ca)s.x=(s.x-.5)*ca/va+.5;else s.y=(s.y-.5)*va/ca+.5;if(mi>.5)s.x=1.-s.x;vec3 c=texture2D(t,s).rgb;if(fe>.5){vec4 d=texture2D(f,fu);c=c*(1.-d.a)+d.rgb;}c*=1.-.22*r;gl_FragColor=vec4(c*m,1.);}';
  try{
    gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
    if(gl){
      cv.width=960;cv.height=720;
      var mk=function(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;};
      var pr=gl.createProgram();
      gl.attachShader(pr,mk(gl.VERTEX_SHADER,'attribute vec2 a;varying vec2 u;void main(){u=a*.5+.5;gl_Position=vec4(a,0.,1.);}'));
      gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));
      gl.linkProgram(pr);
      if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
        gl.useProgram(pr);
        gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
        var al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
        tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        uVa=gl.getUniformLocation(pr,'va');uFe=gl.getUniformLocation(pr,'fe');uMi=gl.getUniformLocation(pr,'mi');
        gl.uniform1i(gl.getUniformLocation(pr,'f'),1);
        glok=true;
        var fim=document.getElementById('frameimg');
        var upF=function(){
          try{
            gl.activeTexture(gl.TEXTURE1);
            var ft=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,ft);
            gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fim);
            gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
            fready=true;
          }catch(e){fready=false;}
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
        };
        if(fim.complete&&fim.naturalWidth)upF();else fim.addEventListener('load',upF);
      }
    }
  }catch(e){glok=false;}
  function draw(){
    requestAnimationFrame(draw);
    var src=upImg||((stream&&v.readyState>=2&&v.videoWidth)?v:null);
    if(!glok||!src)return;
    gl.viewport(0,0,cv.width,cv.height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.uniform1f(uFe,(fready&&F().fr)?1:0);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.uniform1f(uVa,upImg?upImg.width/upImg.height:v.videoWidth/v.videoHeight);
    gl.uniform1f(uMi,upImg?0:1);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  draw();

  /* hand gestures */
  var hl=null,hlTried=false,lastDet=0,cdT=null,cdOn=false,cdHand=false,palmSince=0,lastPalm=0,cool=0;
  var cdEl=document.getElementById('cd');
  function say(t){osd.textContent=t;osd.classList.add('show');clearTimeout(osdT);osdT=setTimeout(function(){osd.classList.remove('show');},1800);}
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  function ext(l,t,p){return dist(l[0],l[t])>dist(l[0],l[p])*1.1;}
  function isPalm(l){return ext(l,8,6)&&ext(l,12,10)&&ext(l,16,14)&&ext(l,20,18)&&dist(l[4],l[17])>dist(l[3],l[17])*1.05&&dist(l[4],l[8])>dist(l[0],l[9])*.5;}
  
  
  
  function cancelCd(){clearTimeout(cdT);cdOn=false;cdEl.style.opacity=0;}
  function countdown(byHand){
    if(cdOn||!stream)return;
    cdOn=true;cdHand=!!byHand;var n=5;
    (function tick(){
      if(!cdOn)return;
      if(n===0){cdEl.style.opacity=0;cdOn=false;cool=performance.now()+3000;snap();return;}
      cdEl.textContent=n;cdEl.style.opacity=1;n--;cdT=setTimeout(tick,1000);
    })();
  }
  function handLoop(){
    requestAnimationFrame(handLoop);
    var now=performance.now();
    if(!hl||!stream||!powered||v.readyState<2||now-lastDet<90)return;
    lastDet=now;
    var r;try{r=hl.detectForVideo(v,now);}catch(e){return;}
    var hs=(r&&r.landmarks)||[],palm=false;
    for(var i=0;i<hs.length;i++){if(isPalm(hs[i]))palm=true;}
    if(palm){
      lastPalm=now;if(!palmSince)palmSince=now;
      if(!cdOn&&now>cool&&now-palmSince>500)countdown(true);
    }else if(!palm){
      palmSince=0;
      
    }
  }
  handLoop();
  function loadHands(){
    if(hl||hlTried)return;hlTried=true;
    say('HAND AI LOADING...');
    var base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    import(base+'/vision_bundle.mjs').then(function(M){
      return M.FilesetResolver.forVisionTasks(base+'/wasm').then(function(fs){
        return M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2});
      });
    }).then(function(h){hl=h;say('HAND AI READY ✋');})
    .catch(function(){say('HAND AI OFF');note.textContent='이 환경에서는 손 인식 모델을 불러올 수 없어요. ⏱ 버튼으로 5초 타이머는 쓸 수 있어요.';});
  }
  document.getElementById('timer').addEventListener('click',function(){
    if(cdOn){cancelCd();return;}
    if(!stream){if(!powered)powerOn();else goStart();return;}
    countdown(false);
  });

  var frameEl=document.getElementById('frameimg');
  var FILTERS=[
    {n:'BLUE CRT',f:'saturate(.85) contrast(1.05)',c:'#4a9fdc',a:.55,m:'soft-light'},
    {n:'흑백',f:'grayscale(1) contrast(1.15)',c:'#ffffff',a:0,m:'normal'},
    {n:'세피아',f:'sepia(.9) contrast(1.05)',c:'#a0703a',a:.25,m:'soft-light'},
    {n:'GREEN TERMINAL',f:'grayscale(1) contrast(1.3) brightness(.95)',c:'#18ff55',a:.8,m:'multiply'},
    {n:'AMBER',f:'grayscale(1) contrast(1.3) brightness(.95)',c:'#ffb000',a:.85,m:'multiply'},
    {n:'네거티브',f:'invert(1) hue-rotate(180deg)',c:'#ffffff',a:0,m:'normal'},
    {n:'NEON PINK',f:'saturate(1.6) contrast(1.1)',c:'#ff3ea5',a:.4,m:'overlay'},
    {n:'mypet_eunbyeol',f:'saturate(1.05)',c:'#ffffff',a:0,m:'normal',fr:1}
  ];
  var fi=0,osd=document.getElementById('osd'),tintEl=document.querySelector('.tint'),osdT=null;
  function F(){return FILTERS[fi];}
  function applyF(show){
    var f=F();
    v.style.filter=f.f;cv.style.filter=f.f;frameEl.style.display=(f.fr&&!(glok&&fready))?'block':'none';
    tintEl.style.background=f.c;tintEl.style.opacity=f.a;tintEl.style.mixBlendMode=f.m;
    if(show){
      osd.textContent='FILTER '+(fi+1)+'/'+FILTERS.length+'  '+f.n;osd.classList.add('show');
      clearTimeout(osdT);osdT=setTimeout(function(){osd.classList.remove('show');},1600);
    }
  }
  applyF(false);
  document.getElementById('fbtn').addEventListener('click',function(){
    if(!powered||screen.classList.contains('home'))return;
    fi=(fi+1)%FILTERS.length;applyF(true);
  });
  var powered=true,busy=false;
  function powerOff(){
    if(busy)return;busy=true;
    cancelCd();
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;v.srcObject=null;}
    upImg=null;powered=false;mon.classList.remove('live-on');
    screen.classList.add('closing');
    setTimeout(function(){
      screen.classList.remove('closing','live','glon','home','wait','deny');screen.classList.add('off');
      var p=screen.querySelector('.pic');if(p)p.remove();
      btn.textContent='📷 카메라 켜기';
      note.textContent='모니터가 꺼져 있어요. 오른쪽 아래 전원 버튼을 눌러 켜세요.';
      busy=false;
    },320);
  }
  function powerOn(){
    if(busy)return;busy=true;
    powered=true;mon.classList.add('live-on');
    screen.classList.remove('off');v.style.display='';screen.classList.add('home');
    note.textContent='화면의 Click to Start-! 버튼을 눌러 시작하세요.';
    screen.classList.add('opening');
    setTimeout(function(){screen.classList.remove('opening');busy=false;},420);
  }
  pwr.addEventListener('click',function(){if(powered)powerOff();else powerOn();});
  var AC=null;
  function click(dn){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      var t=AC.currentTime,os=AC.createOscillator(),gn=AC.createGain();
      os.type='square';os.frequency.setValueAtTime(dn?900:600,t);os.frequency.exponentialRampToValueAtTime(dn?200:150,t+.04);
      gn.gain.setValueAtTime(dn?.07:.04,t);gn.gain.exponentialRampToValueAtTime(.001,t+.05);
      os.connect(gn);gn.connect(AC.destination);os.start(t);os.stop(t+.06);
    }catch(e){}
    if(dn&&navigator.vibrate){try{navigator.vibrate(8);}catch(e){}}
  }
  function press(hEl,cEl){
    hEl.addEventListener('pointerdown',function(){cEl.classList.add('down');click(true);});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
      hEl.addEventListener(ev,function(){if(cEl.classList.contains('down')){cEl.classList.remove('down');click(false);}});
    });
  }
  press(document.getElementById('fbtn'),document.getElementById('capf'));
  press(pwr,document.getElementById('cappw'));
  press(homeBtn,homeBtn);
  startBtn.addEventListener('pointerdown',function(){click(true);});
  startBtn.addEventListener('click',goStart);
  homeBtn.addEventListener('click',goHome);
  var folderBtn=document.getElementById('folderbtn'),upin=document.getElementById('upin');
  press(folderBtn,folderBtn);
  folderBtn.addEventListener('click',function(){if(powered&&!busy)upin.click();});
  upin.addEventListener('change',function(){
    var fl=upin.files&&upin.files[0];upin.value='';if(!fl)return;
    var url=URL.createObjectURL(fl),im=new Image();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);

      else{var pi=new Image();pi.src=c.toDataURL('image/jpeg',.9);pi.className='pic';pi.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:'+F().f;screen.insertBefore(pi,screen.firstChild);}
      say('IMAGE LOADED');
    };
    im.onerror=function(){URL.revokeObjectURL(url);say('IMAGE ERROR');};
    im.src=url;
  });
  press(document.getElementById('mousebtn'),document.getElementById('capm'));
  document.getElementById('mousebtn').addEventListener('click',function(){if((stream||upImg)&&!cdOn)snap();});
  document.addEventListener('keydown',function(e){if(e.code==='Space'&&(stream||upImg)&&!cdOn){e.preventDefault();snap();}});
})();
</script>
