:root{--bg:#f7f7f6;--ink:#2b2b2b;--blue:#4a9fdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh;justify-content:center}
.frame{position:relative;flex:none;width:min(calc(100vw - 32px),1240px,calc((100vh - 32px)*955/834));aspect-ratio:955/834;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 2.5%,#000 97.5%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 2.5%,#000 97.5%,transparent);mask-composite:intersect}
.stage{position:absolute;left:-5.7592%;top:-15.3477%;width:107.2251%;aspect-ratio:1}
.art{position:absolute;inset:0;width:100%;height:100%;background:var(--art) center/100% 100% no-repeat;z-index:3;pointer-events:none;user-select:none;-webkit-user-drag:none}
.screen{position:absolute;left:27.637%;top:26.270%;width:44.531%;height:34.082%;z-index:1;overflow:hidden;background:#3f8fcc}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1) scale(1.02);filter:saturate(.85) contrast(1.05);display:none}
.screen.live video{display:block}
.tint{position:absolute;inset:0;background:var(--blue);mix-blend-mode:soft-light;opacity:.55;pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);pointer-events:none}
.glass{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 28% 8%,rgba(255,255,255,.22),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,15,50,.4) 100%)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10%;color:#fbd934;font-weight:900;font-size:clamp(16px,4.6vw,32px);line-height:1.12;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 0 6px rgba(251,217,52,.35)}
.screen.live .msg{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.osd{position:absolute;left:6%;bottom:7%;color:#7dff8a;font:700 clamp(10px,2.4vw,14px) ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-shadow:0 0 4px #1aff4a;opacity:0;transition:opacity .3s;pointer-events:none}
.osd.show{opacity:1}
#crt{display:none;position:absolute;inset:0;width:100%;height:100%}
.screen.glon #crt{display:block}
.screen.glon video{position:absolute;inset:0;opacity:0;pointer-events:none}
.screen{container-type:size}
.hint{display:none;position:absolute;left:23.516%;top:85.324%;width:51.264%;height:7.728%;background:var(--hintimg) center/100% 100% no-repeat;pointer-events:none}
.screen.cam.live:not(.home):not(.counting):not(.nohand) .hint{display:block}
.osd{left:50%!important;right:auto;bottom:auto!important;top:7%;transform:translateX(-50%);white-space:nowrap}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Open Sans","Segoe UI",sans-serif;font-size:26cqh;font-weight:600;line-height:1;color:#fff;-webkit-text-stroke:.5cqh #000;paint-order:stroke fill;text-shadow:.3cqh .45cqh .35cqh rgba(0,0,0,.35);opacity:0;pointer-events:none}
.screen.off{background:#1a1f22}
.screen.off>*:not(.glass){visibility:hidden}
.screen.closing{animation:crtoff .32s ease-in forwards}
.screen.opening{animation:crton .42s ease-out}
@keyframes crtoff{0%{transform:scale(1,1);filter:brightness(1)}60%{transform:scale(1,.02);filter:brightness(2.5)}100%{transform:scale(0,.005);filter:brightness(3)}}
@keyframes crton{0%{transform:scale(0,.005);filter:brightness(3)}40%{transform:scale(1,.02);filter:brightness(2.5)}100%{transform:scale(1,1);filter:brightness(1)}}
.hit{position:absolute;z-index:4;cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}
.cap{position:absolute;z-index:4;border-radius:6px;pointer-events:none;background-image:var(--art);background-repeat:no-repeat;transition:transform .06s,filter .06s,box-shadow .06s}
.cap.down{transform:translateY(2px);filter:brightness(.84) contrast(1.05);box-shadow:inset 0 3px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.35)}
#frameimg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.ledcover{position:absolute;z-index:4;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 35%,#8d9686,#4c5647)}
.live-on .ledcover{display:none}
.shoot{margin-top:26px;font:inherit;font-weight:900;font-size:18px;padding:14px 30px;border-radius:999px;border:3px solid var(--ink);background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.shoot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.note{margin-top:14px;font-size:13px;opacity:.75;text-align:center;max-width:420px;line-height:1.5}
.gallery{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px;width:min(94vw,720px)}
.gallery figure{margin:0;background:#fff;padding:8px 8px 6px;border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.12);transform:rotate(var(--r))}
.gallery img{width:150px;display:block;border-radius:2px}
.gallery figcaption{font-size:11px;text-align:center;margin-top:4px}
.mainp{display:none;position:absolute;inset:0;background:var(--main) center/100% 100% no-repeat}
.screen.home .mainp{display:block}
.namep{display:none;position:absolute;inset:0;background:var(--nameimg) center/100% 100% no-repeat}
.screen.name .namep{display:block}
.screen.name .tint,.screen.name .scan,.screen.name .glass,.screen.name #homebtn,.screen.name #folderbtn,.screen.name .hint{display:none}
.clock{position:absolute;left:0;right:0;top:55%;transform:translateY(-50%);text-align:center;font-family:"Exo 2","Segoe UI",sans-serif;font-weight:700;font-size:4.6cqh;line-height:1;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:.55cqh #000;paint-order:stroke fill;text-shadow:.25cqh .4cqh .4cqh rgba(0,0,0,.35);white-space:nowrap;pointer-events:none}
.clock span+span{margin-left:1.2em}
.namein{position:absolute;left:25.867%;top:63.154%;width:48.325%;height:7.026%;margin:0;border:0;border-radius:.6cqh;background:#fff;padding:0 2.4cqh;font-family:"Exo 2","Segoe UI",sans-serif;font-size:3.1cqh;color:#2b2b2b;outline:none;-webkit-appearance:none;appearance:none}
.namein::placeholder{color:#c6c6c6}
.namein:focus{box-shadow:0 0 0 .35cqh rgba(80,160,255,.55)}
.namein.err{animation:shake .4s}
.namein.err::placeholder{color:#e57373}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-1.2%)}40%,80%{transform:translateX(1.2%)}}
.gobtn{position:absolute;left:41.740%;top:78.220%;width:16.578%;height:7.963%;border:0;padding:0;margin:0;background:var(--goimg) center/100% 100% no-repeat;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .08s;filter:drop-shadow(0 .5cqh .4cqh rgba(10,50,140,.35))}
.gobtn:hover{filter:drop-shadow(0 .5cqh .4cqh rgba(10,50,140,.35)) brightness(1.08)}
.gobtn:active{transform:translateY(.3cqh) scale(.96);filter:drop-shadow(0 .2cqh .2cqh rgba(10,50,140,.35)) brightness(.92)}
.stimg{display:none;position:absolute;inset:0;background:center/100% 100% no-repeat}
.screen.wait .stimg{display:block;background-image:var(--waitimg)}
.screen.deny .stimg{display:block;background-image:var(--denyimg)}
.screen.wait .tint,.screen.wait .scan,.screen.wait .glass,.screen.deny .tint,.screen.deny .scan,.screen.deny .glass{display:none}
.msg{display:none!important}
.screen.home .tint,.screen.home .scan,.screen.home .glass,.screen.home .msg,.screen.home #homebtn{display:none}
.start{position:absolute;border:0;padding:0;margin:0;background:var(--startimg) center/100% 100% no-repeat;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:floaty 2.2s ease-in-out infinite;filter:drop-shadow(0 7px 4px rgba(10,60,160,.35))}
.start:active{animation:none;transform:translateY(3%) scale(.95);filter:drop-shadow(0 2px 2px rgba(10,60,160,.35)) brightness(.92)}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11%) scale(1.025)}}
.homebtn{position:absolute;z-index:6;border:0;padding:0;margin:0;background:var(--homeimg) center/100% 100% no-repeat;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .06s,filter .06s}
.folderbtn{background-image:var(--folderimg)}
.screen.home #folderbtn{display:none}
.homebtn.down{transform:translateY(2px) scale(.94);filter:brightness(.85)}

.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(96vw,680px);margin-top:14px}
.icons:empty{display:none}
@media (min-width:1100px){.icons{position:fixed;left:20px;top:20px;margin:0;width:auto;max-height:calc(100vh - 40px);display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,112px);grid-auto-columns:96px;gap:4px;align-content:start}}
.icon{position:relative;width:96px;height:108px;border:1px solid transparent;border-radius:4px;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:#1f2a3a;-webkit-tap-highlight-color:transparent}
.icon svg{width:58px;height:52px;flex:none}
.icon:hover{background:rgba(49,106,197,.10);border-color:rgba(49,106,197,.25)}
.icon:focus-visible{outline:none;background:rgba(49,106,197,.16);border-color:#316ac5}
.icon .lb{font-family:"Exo 2","Segoe UI",Tahoma,sans-serif;font-size:12.5px;line-height:1.25;max-width:100%;padding:1px 4px;border-radius:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;text-align:center}
.icon:focus-visible .lb{background:#316ac5;color:#fff}
.icon .bd{position:absolute;top:2px;right:12px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:linear-gradient(#4f9bff,#1b5fd6);color:#fff;font:700 11px/18px "Exo 2","Segoe UI",sans-serif;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.icon .bd:empty{display:none}
.icon.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.icon.bump svg{animation:bump .55s}
@keyframes bump{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px) scale(1.07)}60%{transform:translateY(0) scale(.97)}}
.win{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,30,70,.25)}
.win[hidden],.viewer[hidden],.wgrid[hidden],.wempty[hidden]{display:none}
.winbox{width:min(760px,100%);max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:#ece9d8;border:3px solid #0a46c4;border-radius:9px 9px 4px 4px;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden;font-family:"Exo 2","Segoe UI",Tahoma,sans-serif;animation:winin .18s ease-out}
@keyframes winin{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.wtitle{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:linear-gradient(#3d8bff,#0a5ae0 45%,#0849c3);color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.wtitle svg{width:22px;height:20px;flex:none}
.wtitle .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtitle .ct{font-weight:400;font-size:13px;opacity:.9;white-space:nowrap}
.wx{width:28px;height:26px;border:1.5px solid #fff;border-radius:4px;background:linear-gradient(#ee8a70,#c4381c);color:#fff;font:700 14px/1 sans-serif;cursor:pointer}
.wx:hover{filter:brightness(1.1)}
.wtool{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid #c8c4b0;background:#f3f1e6;flex-wrap:wrap}
.xbtn{font:inherit;font-size:13px;padding:5px 12px;border:1px solid #7a8ba8;border-radius:4px;background:linear-gradient(#fff,#e3e3db);color:#1f2a3a;cursor:pointer}
.xbtn:hover{border-color:#3a6fd8}
.xbtn:active{background:linear-gradient(#e3e3db,#fff)}
.xbtn:disabled{opacity:.5;cursor:default}
.xbtn.warn{color:#b3261e}
.xbtn.armed{background:#c4381c;color:#fff;border-color:#8e2410}
.wgrid{flex:1;overflow:auto;padding:12px;background:#fff;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.thumb{border:1px solid transparent;border-radius:4px;background:none;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;font:inherit;color:#1f2a3a;min-width:0}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #c9c9c9;box-shadow:0 2px 4px rgba(0,0,0,.12);display:block}
.thumb span{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb:hover{background:rgba(49,106,197,.1);border-color:rgba(49,106,197,.3)}
.wempty{flex:1;padding:48px 12px;text-align:center;color:#6b6b6b;background:#fff;font-size:14px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;font-family:"Exo 2","Segoe UI",Tahoma,sans-serif}
.viewer img{max-width:100%;max-height:calc(100vh - 120px);border:4px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.vname{color:#fff;font-size:13px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>

<script>
(function(){
  var v=document.getElementById('v'),screen=document.getElementById('screen'),mon=document.getElementById('monitor'),
      btn=document.getElementById('shoot'),note=document.getElementById('note'),gal=document.getElementById('gal'),
      flash=document.getElementById('flash'),msg=document.getElementById('msg'),pwr=document.getElementById('pwr');
  var stream=null,count=0,upImg=null;
  /* ---------- folder storage ---------- */
  var nameIn=document.getElementById('nameIn'),goBtn=document.getElementById('gobtn'),clockEl=document.getElementById('clock');
  var curName='';
  var dlP=(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use('downloads')).catch(function(){return null;}):Promise.resolve(null);
  function cleanName(v){return String(v||'').replace(/[\\\/:*?"<>|\x00-\x1f]/g,'_').replace(/\s+/g,' ').trim().replace(/^\.+|\.+$/g,'').slice(0,40);}
  var DBP=null;
  function openDB(){
    if(DBP)return DBP;
    DBP=new Promise(function(res){
      try{
        var r=indexedDB.open('photobooth',2);
        r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id',autoIncrement:true});};
        r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};r.onblocked=function(){res(null);};
      }catch(e){res(null);}
    });
    return DBP;
  }
  function dbDo(name,mode,fn){return openDB().then(function(d){if(!d)return null;return new Promise(function(res){try{var q=fn(d.transaction(name,mode).objectStore(name));q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});});}
  var folders=[],openF=null,vIdx=0;
  var iconsEl=document.getElementById('icons'),win=document.getElementById('win'),wname=document.getElementById('wname'),wcount=document.getElementById('wcount'),
      wgrid=document.getElementById('wgrid'),wempty=document.getElementById('wempty'),wzip=document.getElementById('wzip'),wdel=document.getElementById('wdel'),
      viewer=document.getElementById('viewer'),vimg=document.getElementById('vimg'),vname=document.getElementById('vname');
  function getF(n){for(var i=0;i<folders.length;i++)if(folders[i].name===n)return folders[i];return null;}
  function saveOrder(){var names=folders.map(function(x){return x.name;});dbDo('kv','readwrite',function(st){return st.put(names,'folders');});}
  function ensureFolder(n){var x=getF(n);if(!x){x={name:n,photos:[]};folders.push(x);saveOrder();renderIcons(n);}return x;}
  function iconFor(n){var els=iconsEl.querySelectorAll('.icon');for(var i=0;i<els.length;i++)if(els[i].dataset.name===n)return els[i];return null;}
  function renderIcons(popName){
    iconsEl.innerHTML='';
    folders.forEach(function(x){
      var b=document.createElement('button');b.className='icon'+(x.name===popName?' pop':'');b.dataset.name=x.name;b.title=x.name+' ('+x.photos.length+'장)';
      b.innerHTML='<svg aria-hidden="true"><use href="#fico"/></svg><span class="bd"></span><span class="lb"></span>';
      b.querySelector('.lb').textContent=x.name;b.querySelector('.bd').textContent=x.photos.length||'';
      b.addEventListener('click',function(){openWin(x);});
      iconsEl.appendChild(b);
    });
  }
  function bumpIcon(n){var b=iconFor(n),x=getF(n);if(!b||!x)return;b.querySelector('.bd').textContent=x.photos.length||'';b.title=x.name+' ('+x.photos.length+'장)';b.classList.remove('bump','pop');void b.offsetWidth;b.classList.add('bump');}
  function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}

    {n:'세피아',f:'sepia(.9) contrast(1.05)',c:'#a0703a',a:.25,m:'soft-light'},
    {n:'GREEN TERMINAL',f:'grayscale(1) contrast(1.3) brightness(.95)',c:'#18ff55',a:.8,m:'multiply'},
    {n:'AMBER',f:'grayscale(1) contrast(1.3) brightness(.95)',c:'#ffb000',a:.85,m:'multiply'},
    {n:'네거티브',f:'invert(1) hue-rotate(180deg)',c:'#ffffff',a:0,m:'normal'},
    {n:'NEON PINK',f:'saturate(1.6) contrast(1.1)',c:'#ff3ea5',a:.4,m:'overlay'},
    {n:'mypet_eunbyeol',f:'saturate(1.05)',c:'#ffffff',a:0,m:'normal',fr:1}
  ];
  var fi=0,osd=document.getElementById('osd'),tintEl=document.querySelector('.tint'),osdT=null;
  function F(){return FILTERS[fi];}
  function applyF(show){
    var f=F();
    v.style.filter=f.f;cv.style.filter=f.f;frameEl.style.display=(f.fr&&!(glok&&fready))?'block':'none';
    tintEl.style.background=f.c;tintEl.style.opacity=f.a;tintEl.style.mixBlendMode=f.m;
    if(show){
      osd.textContent='FILTER '+(fi+1)+'/'+FILTERS.length+'  '+f.n;osd.classList.add('show');
      clearTimeout(osdT);osdT=setTimeout(function(){osd.classList.remove('show');},1600);
    }
  }
  applyF(false);
  document.getElementById('fbtn').addEventListener('click',function(){
    if(!powered||screen.classList.contains('home')||screen.classList.contains('name'))return;
    fi=(fi+1)%FILTERS.length;applyF(true);
  });
  var powered=true,busy=false;
  function powerOff(){
    if(busy)return;busy=true;
    cancelCd();
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;v.srcObject=null;}
    upImg=null;powered=false;screen.classList.remove('cam');mon.classList.remove('live-on');
    screen.classList.add('closing');
    setTimeout(function(){
      screen.classList.remove('closing','live','glon','home','wait','deny','name');screen.classList.add('off');
      var p=screen.querySelector('.pic');if(p)p.remove();
      btn.textContent='📷 카메라 켜기';
      note.textContent='모니터가 꺼져 있어요. 오른쪽 아래 전원 버튼을 눌러 켜세요.';
      busy=false;
    },320);
  }
  function powerOn(){
    if(busy)return;busy=true;
    powered=true;mon.classList.add('live-on');
    screen.classList.remove('off');v.style.display='';screen.classList.add('home');
    note.textContent='화면의 Click to Start-! 버튼을 눌러 시작하세요.';
    screen.classList.add('opening');
    setTimeout(function(){screen.classList.remove('opening');busy=false;},420);
  }
  pwr.addEventListener('click',function(){if(powered)powerOff();else powerOn();});
  var AC=null;
  function click(dn){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      var t=AC.currentTime,os=AC.createOscillator(),gn=AC.createGain();
      os.type='square';os.frequency.setValueAtTime(dn?900:600,t);os.frequency.exponentialRampToValueAtTime(dn?200:150,t+.04);
      gn.gain.setValueAtTime(dn?.07:.04,t);gn.gain.exponentialRampToValueAtTime(.001,t+.05);
      os.connect(gn);gn.connect(AC.destination);os.start(t);os.stop(t+.06);
    }catch(e){}
    if(dn&&navigator.vibrate){try{navigator.vibrate(8);}catch(e){}}
  }
  function press(hEl,cEl){
    hEl.addEventListener('pointerdown',function(){cEl.classList.add('down');click(true);});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
      hEl.addEventListener(ev,function(){if(cEl.classList.contains('down')){cEl.classList.remove('down');click(false);}});
    });
  }
  press(document.getElementById('fbtn'),document.getElementById('capf'));
  press(pwr,document.getElementById('cappw'));
  press(homeBtn,homeBtn);
  startBtn.addEventListener('pointerdown',function(){click(true);});
  startBtn.addEventListener('click',goStart);
  goBtn.addEventListener('pointerdown',function(){click(true);});
  goBtn.addEventListener('click',goName);
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();goName();}});
  nameIn.addEventListener('input',function(){nameIn.classList.remove('err');});
  homeBtn.addEventListener('click',goHome);
  var folderBtn=document.getElementById('folderbtn'),upin=document.getElementById('upin');
  press(folderBtn,folderBtn);
  folderBtn.addEventListener('click',function(){if(powered&&!busy)upin.click();});
  upin.addEventListener('change',function(){
    var fl=upin.files&&upin.files[0];upin.value='';if(!fl)return;
    var url=URL.createObjectURL(fl),im=new Image();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      if(!powered)return;
      cancelCd();upImg=c;
      screen.classList.remove('home','wait','deny');screen.classList.add('live');
      var p=screen.querySelector('.pic');if(p)p.remove();
      if(glok){screen.classList.add('glon');}
      else{var pi=new Image();pi.src=c.toDataURL('image/jpeg',.9);pi.className='pic';pi.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:'+F().f;screen.insertBefore(pi,screen.firstChild);}
      say('IMAGE LOADED');
    };
    im.onerror=function(){URL.revokeObjectURL(url);say('IMAGE ERROR');};
    im.src=url;
  });
  press(document.getElementById('mousebtn'),document.getElementById('capm'));
  document.getElementById('mousebtn').addEventListener('click',function(){if((stream||upImg)&&!cdOn)snap();});
  document.addEventListener('keydown',function(e){if(e.code==='Space'&&e.target!==nameIn&&win.hidden&&viewer.hidden&&(stream||upImg)&&!cdOn){e.preventDefault();snap();}});
})();
</script>
</body>
